name: Build GTA_VI.bin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio esptool
      - name: Unzip, write code, build, merge
        run: |
          f=$(find . -maxdepth 1 -type f -iname 'gta6-cardputer*' | head -n1)
          echo "Found archive: $f"
          cp "$f" /tmp/a.zip
          mkdir /tmp/proj
          unzip /tmp/a.zip -d /tmp/proj
          cd /tmp/proj/gta6-cardputer
          cat > src/main.cpp << 'EOF'
          #include <M5Cardputer.h>
          #include <Preferences.h>
          #include <WiFi.h>
          #include <math.h>

          #define BUILD "v5"

          static const int W = 240;
          static const int H = 135;
          static const int HZ = 100;

          Preferences prefs;
          M5Canvas cv(&M5Cardputer.Display);
          int g_rot = 1;
          uint32_t g_volShown = 0;
          int g_prevVol = 90;

          struct Settings {
            String player = "Player";
            String ssid = "";
            String pass = "";
            int brightness = 160;
            int volume = 90;
          } cfg;

          void loadSettings() {
            prefs.begin("gta6", true);
            cfg.player = prefs.getString("player", "Player");
            cfg.ssid = prefs.getString("ssid", "");
            cfg.pass = prefs.getString("pass", "");
            cfg.brightness = prefs.getInt("bright", 160);
            cfg.volume = prefs.getInt("vol", 90);
            prefs.end();
          }

          void saveSettings() {
            prefs.begin("gta6", false);
            prefs.putString("player", cfg.player);
            prefs.putString("ssid", cfg.ssid);
            prefs.putString("pass", cfg.pass);
            prefs.putInt("bright", cfg.brightness);
            prefs.putInt("vol", cfg.volume);
            prefs.putBool("setup", true);
            prefs.end();
          }

          void saveRot(int r) {
            prefs.begin("gta6", false);
            prefs.putInt("rot", r);
            prefs.putBool("rotok", true);
            prefs.end();
          }

          bool setupDone() {
            prefs.begin("gta6", true);
            bool v = prefs.getBool("setup", false);
            prefs.end();
            return v;
          }

          void applyHw() {
            M5Cardputer.Display.setBrightness(cfg.brightness);
            M5Cardputer.Speaker.setVolume(cfg.volume);
          }

          // ---------- helpers ----------
          static inline uint8_t c8(int v) { return v < 0 ? 0 : (v > 255 ? 255 : v); }
          uint16_t col(int r, int g, int b) { return M5Cardputer.Display.color565(c8(r), c8(g), c8(b)); }

          static inline uint32_t hsh(uint32_t x) {
            x ^= x >> 16; x *= 0x7feb352d; x ^= x >> 15; x *= 0x846ca68b; x ^= x >> 16;
            return x;
          }

          void mix(int r1, int g1, int b1, int r2, int g2, int b2, float t, uint8_t &r, uint8_t &g, uint8_t &b) {
            r = c8(r1 + (r2 - r1) * t);
            g = c8(g1 + (g2 - g1) * t);
            b = c8(b1 + (b2 - b1) * t);
          }

          void sunset(float v, uint8_t &r, uint8_t &g, uint8_t &b) {
            if (v < 0.5f) mix(25, 5, 70, 250, 60, 150, v * 2.0f, r, g, b);
            else mix(250, 60, 150, 255, 160, 60, (v - 0.5f) * 2.0f, r, g, b);
          }

          void gradText(const char *s, int cx, int cy, int size, float k) {
            cv.setTextSize(size);
            cv.setTextDatum(middle_center);
            int h = 8 * size;
            int top = cy - h / 2;
            for (int y = top; y < top + h; y += 2) {
              float v = (float)(y - top) / h;
              uint8_t r, g, b;
              mix(255, 245, 210, 255, 110, 190, v, r, g, b);
              cv.setClipRect(0, y, W, 2);
              cv.setTextColor(col(r * k, g * k, b * k));
              cv.drawString(s, cx, cy);
            }
            cv.clearClipRect();
          }

          void fadeBrightness(int from, int to, int ms) {
            const int steps = 40;
            for (int i = 0; i <= steps; i++) {
              float t = (float)i / steps;
              t = t * t * (3 - 2 * t);
              M5Cardputer.Display.setBrightness(from + (to - from) * t);
              delay(ms / steps);
            }
          }

          struct Key {
            char c = 0;
            bool enter = false, del = false, esc = false;
          };

          bool pollKey(Key &k) {
            M5Cardputer.update();
            if (M5Cardputer.Keyboard.isChange() && M5Cardputer.Keyboard.isPressed()) {
              auto st = M5Cardputer.Keyboard.keysState();
              k = Key();
              k.enter = st.enter;
              k.del = st.del;
              for (char ch : st.word) {
                if (ch == '\n' || ch == '\r') k.enter = true;
                else if (ch == '`') k.esc = true;
                else k.c = ch;
              }
              return k.enter || k.del || k.esc || k.c;
            }
            return false;
          }

          void waitRelease() {
            uint32_t t = millis();
            while (M5Cardputer.Keyboard.isPressed() && millis() - t < 800) {
              M5Cardputer.update();
              delay(10);
            }
          }

          // ---------- volume keys: - quieter, = louder, m mute ----------
          bool handleVolKey(const Key &k) {
            if (k.c != '-' && k.c != '=' && k.c != 'm') return false;
            if (k.c == '-') {
              cfg.volume = cfg.volume - 15;
              if (cfg.volume < 0) cfg.volume = 0;
            } else if (k.c == '=') {
              cfg.volume = cfg.volume + 15;
              if (cfg.volume > 255) cfg.volume = 255;
            } else {
              if (cfg.volume > 0) { g_prevVol = cfg.volume; cfg.volume = 0; }
              else cfg.volume = g_prevVol > 0 ? g_prevVol : 90;
            }
            M5Cardputer.Speaker.setVolume(cfg.volume);
            if (cfg.volume > 0) M5Cardputer.Speaker.tone(1000, 40);
            g_volShown = millis();
            prefs.begin("gta6", false);
            prefs.putInt("vol", cfg.volume);
            prefs.end();
            return true;
          }

          void drawVolHud() {
            if (millis() - g_volShown > 1400) return;
            cv.fillRoundRect(W - 80, 3, 76, 14, 3, TFT_BLACK);
            cv.drawRoundRect(W - 80, 3, 76, 14, 3, TFT_WHITE);
            cv.setTextSize(1);
            cv.setTextDatum(middle_left);
            cv.setTextColor(TFT_WHITE);
            cv.drawString(cfg.volume > 0 ? "VOL" : "MUTE", W - 76, 10);
            cv.drawRect(W - 46, 7, 38, 6, TFT_WHITE);
            cv.fillRect(W - 46, 7, (int)(38 * cfg.volume / 255.0f), 6, col(255, 170, 60));
          }

          // ---------- screen orientation ----------
          int nextLandscape(int cur) {
            for (int i = 1; i <= 4; i++) {
              int r = (cur + i) % 4;
              M5Cardputer.Display.setRotation(r);
              if (M5Cardputer.Display.width() > M5Cardputer.Display.height()) return r;
            }
            M5Cardputer.Display.setRotation(cur);
            return cur;
          }

          void orientationScreen(int &rot) {
            while (true) {
              M5Cardputer.Display.setRotation(rot);
              cv.fillSprite(col(20, 8, 40));
              cv.fillTriangle(W / 2, 6, W / 2 - 18, 32, W / 2 + 18, 32, col(255, 150, 50));
              cv.fillRect(W / 2 - 7, 32, 14, 16, col(255, 150, 50));
              cv.setTextDatum(top_center);
              cv.setTextSize(1);
              cv.setTextColor(TFT_WHITE);
              cv.drawString("THIS IS THE TOP OF THE SCREEN", W / 2, 58);
              cv.setTextSize(2);
              cv.drawString("Is it upright?", W / 2, 76);
              cv.setTextSize(1);
              cv.setTextColor(col(255, 200, 120));
              cv.drawString("ENTER = yes", W / 2, 106);
              cv.drawString("any other key = rotate", W / 2, 118);
              cv.drawString(BUILD, 14, 124);
              cv.pushSprite(0, 0);
              waitRelease();
              Key k;
              while (!pollKey(k)) delay(10);
              if (k.enter) break;
              rot = nextLandscape(rot);
            }
          }

          // ---------- scene pieces ----------
          void skyline(float off, int bw, int minH, int varH, uint16_t c, uint32_t seed, bool windows, int hz) {
            int first = (int)floorf(off / bw);
            for (int i = 0; i <= W / bw + 2; i++) {
              int idx = first + i;
              int x = idx * bw - (int)off;
              int h = minH + (int)(hsh(idx + seed * 977) % varH);
              cv.fillRect(x, hz - h, bw - 1, h, c);
              if (windows) {
                for (int wy = hz - h + 4; wy < hz - 3; wy += 6)
                  for (int wx = x + 3; wx < x + bw - 4; wx += 5)
                    if (hsh(idx * 131 + wy * 17 + wx + seed) % 4 == 0) cv.fillRect(wx, wy, 2, 3, col(255, 200, 90));
              }
            }
          }

          void palm(int bx, int by, int h, float lean, float t, uint16_t c) {
            float sway = sinf(t * 0.8f) * 2.0f;
            int px = bx, py = by;
            for (int i = 1; i <= 10; i++) {
              float u = i / 10.0f;
              int nx = bx + (int)(lean * u * u * h * 0.5f + sway * u);
              int ny = by - (int)(h * u);
              cv.drawLine(px, py, nx, ny, c);
              cv.drawLine(px + 1, py, nx + 1, ny, c);
              cv.drawLine(px + 2, py, nx + 2, ny, c);
              px = nx; py = ny;
            }
            for (int f = 0; f < 8; f++) {
              float a = PI + f * PI / 7.0f + sinf(t * 1.1f + f) * 0.05f;
              int mx = px + (int)(cosf(a) * 10), my = py + (int)(sinf(a) * 9) - 3;
              int ex = px + (int)(cosf(a) * 21), ey = py + (int)(sinf(a) * 8) + 11;
              cv.drawLine(px, py, mx, my, c);
              cv.drawLine(mx, my, ex, ey, c);
              cv.drawLine(px, py + 1, mx, my + 1, c);
              cv.drawLine(mx, my + 1, ex, ey + 1, c);
            }
          }

          void birds(float t, uint16_t c) {
            for (int i = 0; i < 2; i++) {
              int x = ((int)(t * 12) + i * 70) % (W + 40) - 20;
              int y = 14 + i * 9 + (int)(2 * sinf(t * 3 + i));
              int fl = (int)(2 * sinf(t * 9 + i * 2));
              cv.drawLine(x - 3, y - fl, x, y + 2, c);
              cv.drawLine(x, y + 2, x + 3, y - fl, c);
            }
          }

          void stars(float t, int maxY) {
            for (int i = 0; i < 36; i++) {
              int x = hsh(i * 2 + 1) % W, y = hsh(i * 2 + 2) % maxY;
              int b = 90 + (int)(80 * sinf(t * 2.0f + i));
              cv.drawPixel(x, y, col(b, b, b + 30));
            }
          }

          // scene 0: sunset city
          void drawSunsetCity(float t, float logoK) {
            for (int y = 0; y < HZ; y++) {
              uint8_t r, g, b;
              sunset((float)y / HZ, r, g, b);
              cv.drawFastHLine(0, y, W, col(r, g, b));
            }
            stars(t, 50);
            for (int i = 0; i < 3; i++) {
              int x = ((int)(t * 4 * (i + 1)) + i * 90) % (W + 80) - 40;
              cv.fillRoundRect(x, 50 + i * 12, 40 + i * 12, 2, 1, col(255, 150, 190));
            }
            int cx = W / 2, cy = HZ - 14 - (int)(4 * sinf(t * 0.5f));
            for (int dy = -30; dy <= 30; dy++) {
              int y = cy + dy;
              if (y >= HZ) break;
              if (dy > 2 && ((dy / 3) & 1)) continue;
              int hw = (int)sqrtf(900.0f - dy * dy);
              uint8_t r, g, b;
              mix(255, 235, 120, 255, 70, 150, (dy + 30) / 60.0f, r, g, b);
              cv.drawFastHLine(cx - hw, y, 2 * hw, col(r, g, b));
            }
            skyline(t * 3.0f, 12, 14, 22, col(110, 30, 120), 7, false, HZ);
            skyline(t * 8.0f + 50, 18, 24, 34, col(40, 8, 70), 3, true, HZ);
            cv.fillRect(0, HZ, W, H - HZ, col(25, 5, 50));
            for (int i = 0; i < 7; i++) {
              int w = (int)(44 - i * 5 + 5 * sinf(t * 3 + i));
              if (w > 0) cv.drawFastHLine(cx - w / 2, HZ + 2 + i * 4, w, col(255, 150 - i * 15, 100));
            }
            uint16_t pc = col(10, 2, 26);
            palm(24, H + 2, 78, 0.5f, t, pc);
            palm(W - 22, H + 2, 70, -0.45f, t + 1.3f, pc);
            birds(t, pc);
            if (logoK > 0) gradText("GTA VI", W / 2, 30, 4, logoK);
          }

          // scene 1: night drive
          void drawNight(float t, float logoK) {
            const int hz = 64;
            for (int y = 0; y < hz; y++) {
              uint8_t r, g, b;
              mix(6, 4, 40, 120, 30, 120, (float)y / hz, r, g, b);
              cv.drawFastHLine(0, y, W, col(r, g, b));
            }
            stars(t, 40);
            cv.fillCircle(196, 22, 12, col(70, 40, 110));
            cv.fillCircle(196, 22, 9, col(250, 245, 215));
            skyline(t * 4.0f, 12, 12, 18, col(55, 18, 85), 11, false, hz);
            skyline(t * 10.0f + 30, 16, 18, 26, col(22, 8, 50), 5, true, hz);
            cv.fillRect(0, hz, W, H - hz, col(14, 10, 30));
            cv.fillRect(0, hz + 6, W, 36, col(32, 30, 52));
            cv.drawFastHLine(0, hz + 6, W, col(255, 80, 170));
            cv.drawFastHLine(0, hz + 41, W, col(80, 220, 255));
            int off = (int)(t * 110) % 36;
            for (int x = -36 + off; x < W; x += 36) cv.fillRect(x, hz + 23, 18, 2, col(230, 230, 190));
            int off2 = (int)(t * 55) % 90;
            for (int x = -90 + off2; x < W + 90; x += 90) {
              cv.fillRect(x, hz - 12, 2, 18, col(70, 60, 100));
              cv.fillCircle(x + 1, hz - 13, 9, col(60, 40, 40));
              cv.fillCircle(x + 1, hz - 13, 4, col(255, 220, 130));
            }
            int cx = 96 + (int)(6 * sinf(t * 0.7f));
            int cy = hz + 28;
            int bob = (int)(sinf(t * 14.0f));
            cv.fillTriangle(cx + 44, cy - 6 + bob, cx + 96, cy - 16 + bob, cx + 96, cy + 4 + bob, col(80, 72, 40));
            cv.fillRoundRect(cx, cy - 9 + bob, 44, 10, 3, col(255, 60, 140));
            cv.fillRoundRect(cx + 10, cy - 15 + bob, 22, 7, 3, col(200, 30, 110));
            cv.fillRect(cx + 13, cy - 13 + bob, 7, 4, col(20, 40, 70));
            cv.fillRect(cx + 22, cy - 13 + bob, 7, 4, col(20, 40, 70));
            cv.fillRect(cx - 1, cy - 6 + bob, 2, 3, col(255, 40, 40));
            cv.fillRect(cx + 43, cy - 6 + bob, 2, 3, col(255, 250, 180));
            cv.fillCircle(cx + 9, cy + 2, 4, col(8, 8, 12));
            cv.fillCircle(cx + 35, cy + 2, 4, col(8, 8, 12));
            cv.fillCircle(cx + 9, cy + 2, 1, col(150, 150, 170));
            cv.fillCircle(cx + 35, cy + 2, 1, col(150, 150, 170));
            if (logoK > 0) gradText("GTA VI", W / 2, 30, 4, logoK);
          }

          // scene 2: beach sunset
          void drawBeach(float t, float logoK) {
            const int hz = 62;
            for (int y = 0; y < hz; y++) {
              uint8_t r, g, b;
              mix(60, 15, 110, 255, 150, 70, (float)y / hz, r, g, b);
              cv.drawFastHLine(0, y, W, col(r, g, b));
            }
            for (int i = 0; i < 3; i++) {
              int x = (((int)(t * 5 * (i + 1)) + i * 80) % (W + 70)) - 35;
              cv.fillRoundRect(x, 16 + i * 14, 34 + i * 10, 3, 1, col(255, 170, 170));
            }
            int cx = W / 2;
            int cy = hz + (int)(fmaxf(0.0f, 8.0f - t) * 2.0f);
            for (int dy = -32; dy <= 0; dy++) {
              int y = cy + dy;
              if (y >= hz) break;
              int hw = (int)sqrtf(1024.0f - dy * dy);
              uint8_t r, g, b;
              mix(255, 240, 130, 255, 90, 140, (dy + 32) / 32.0f, r, g, b);
              cv.drawFastHLine(cx - hw, y, 2 * hw, col(r, g, b));
            }
            cv.fillTriangle(0, hz, 34, hz - 12, 80, hz, col(70, 20, 100));
            cv.fillTriangle(150, hz, 190, hz - 8, 240, hz, col(70, 20, 100));
            for (int y = hz; y < H; y++) {
              uint8_t r, g, b;
              mix(130, 40, 130, 15, 8, 55, (float)(y - hz) / (H - hz), r, g, b);
              cv.drawFastHLine(0, y, W, col(r, g, b));
            }
            for (int y = hz + 1; y < 104; y += 3) {
              int w = (int)(46 - (y - hz) * 0.7f + 7 * sinf(t * 3 + y));
              if (w > 2) cv.drawFastHLine(cx - w / 2, y, w, col(255, 200, 110));
            }
            for (int i = 0; i < 14; i++) {
              int y = hz + 4 + i * 3;
              int dir = (i & 1) ? 1 : -1;
              int x = (((int)(t * (6 + i % 4) * dir) + (int)(hsh(i) % W)) % W + W) % W;
              cv.drawFastHLine(x, y, 8 + (i % 4) * 3, col(200, 120, 190));
            }
            uint16_t pc = col(10, 2, 26);
            palm(W - 24, H + 2, 84, -0.45f, t, pc);
            palm(18, H + 2, 70, 0.5f, t + 1.0f, pc);
            birds(t, pc);
            if (logoK > 0) gradText("GTA VI", W / 2, 30, 4, logoK);
          }

          void drawScene(int v, float t, float logoK) {
            if (v == 1) drawNight(t, logoK);
            else if (v == 2) drawBeach(t, logoK);
            else drawSunsetCity(t, logoK);
          }

          void uiPanel() {
            cv.fillRect(0, 104, W, 31, col(12, 4, 28));
            cv.drawFastHLine(0, 104, W, col(250, 60, 150));
          }

          // ---------- loading ----------
          const char *tips[] = {
            "Warming up the neon...", "Tuning the radio...", "Polishing the sunset...",
            "Counting palm trees...", "Neon lights. Warm nights.", "Big dreams. Bigger sunsets.",
            "Fueling the getaway car...", "Streaming the skyline...", "Don't blink.",
            "Teaching seagulls to behave...", "Parking the cars badly...", "Hiding the good stuff..."
          };
          const int NT = 12;
          const char *stallTips[] = {"99%... any moment now", "Still 99%. Trust the process.",
                                     "Waiting for Trailer 3...", "Almost there. Honest."};

          void loadingScreen(uint32_t durMs, uint32_t stallMs, int baseVar) {
            uint32_t t0 = millis(), lastTip = t0;
            int tip = (baseVar * 4) % NT;
            M5Cardputer.Display.setBrightness(0);
            while (true) {
              uint32_t now = millis();
              uint32_t ms = now - t0;
              if (ms >= durMs + stallMs) break;
              float el = ms / 1000.0f;
              int var = (baseVar + (int)(ms / 8000)) % 3;
              uint32_t ph = ms % 8000;
              float sk = 1.0f;
              if (ph < 400) sk = ph / 400.0f;
              else if (ph > 7600) sk = (8000 - ph) / 400.0f;
              float fk = el / 1.2f;
              if (fk > 1) fk = 1;
              float k = fk < sk ? fk : sk;
              M5Cardputer.Display.setBrightness((int)(cfg.brightness * k));

              float lk = ph / 2000.0f;
              if (lk > 1) lk = 1;
              drawScene(var, el + var * 7, lk);
              uiPanel();

              float u = ms >= durMs ? 1.0f : (float)ms / durMs;
              float s = u * u * (3 - 2 * u);
              bool stall = ms >= durMs && stallMs > 0;
              float p = s * (stallMs > 0 ? 99.0f : 100.0f);

              uint32_t ti = now - lastTip;
              if (ti > 2800) { tip = (tip + 1) % NT; lastTip = now; ti = 0; }
              float a = ti / 500.0f;
              if (a > 1) a = 1;
              float b2 = (2800 - (float)ti) / 500.0f;
              if (b2 < a) a = b2;
              if (a < 0) a = 0;
              const char *msg = stall ? stallTips[(ms - durMs) / 1500 % 4] : tips[tip];
              if (stall) a = 1;
              cv.setTextSize(1);
              cv.setTextDatum(middle_center);
              cv.setTextColor(col(255 * a, 230 * a, 200 * a));
              cv.drawString(msg, W / 2, 113);

              cv.drawRoundRect(20, 121, 170, 8, 4, col(255, 255, 255));
              int fw = (int)(166 * p / 100.0f);
              if (fw > 4) cv.fillRoundRect(22, 123, fw, 4, 2, col(255, 170, 60));
              else if (fw > 0) cv.fillRect(22, 123, fw, 4, col(255, 170, 60));
              char buf[8];
              snprintf(buf, sizeof(buf), "%d%%", (int)p);
              cv.setTextDatum(middle_left);
              cv.setTextColor(TFT_WHITE);
              cv.drawString(buf, 196, 125);
              drawVolHud();
              cv.pushSprite(0, 0);

              Key kk;
              if (pollKey(kk)) {
                if (kk.esc) break;
                handleVolKey(kk);
              }
            }
          }

          void finale() {
            M5Cardputer.Speaker.tone(784, 120);
            delay(140);
            M5Cardputer.Speaker.tone(1046, 220);
            M5Cardputer.Display.setBrightness(255);
            delay(140);
            fadeBrightness(255, 0, 500);
          }

          // ---------- intro ----------
          void rockstarSplash() {
            cv.fillSprite(TFT_BLACK);
            cv.setTextDatum(middle_center);
            cv.setTextSize(2);
            cv.setTextColor(TFT_WHITE);
            cv.drawString("ROCKSTAR GAMES", W / 2, H / 2 - 8);
            cv.setTextSize(1);
            cv.setTextColor(col(180, 180, 180));
            cv.drawString("presents", W / 2, H / 2 + 14);
            cv.setTextDatum(top_left);
            cv.setTextColor(col(120, 120, 120));
            cv.drawString(BUILD, 4, 4);
            M5Cardputer.Display.setBrightness(0);
            cv.pushSprite(0, 0);
            fadeBrightness(0, cfg.brightness, 1800);
            delay(1200);
            fadeBrightness(cfg.brightness, 0, 1200);
          }

          void bars() {
            cv.fillRect(0, 0, W, 16, TFT_BLACK);
            cv.fillRect(0, H - 18, W, 18, TFT_BLACK);
          }

          // returns false if skipped
          bool playScene(int v, const char *cap, uint32_t ms, float toff) {
            uint32_t t0 = millis();
            while (true) {
              uint32_t e = millis() - t0;
              if (e >= ms) break;
              float t = toff + e / 1000.0f;
              float k = 1.0f;
              if (e < 700) k = e / 700.0f;
              else if (e > ms - 700) k = (ms - e) / 700.0f;
              M5Cardputer.Display.setBrightness((int)(cfg.brightness * k));
              drawScene(v, t, 0);
              bars();
              cv.setTextSize(1);
              cv.setTextDatum(middle_center);
              cv.setTextColor(col(235 * k, 220 * k, 200 * k));
              cv.drawString(cap, W / 2, H - 9);
              cv.setTextDatum(top_left);
              cv.setTextColor(col(90, 90, 90));
              cv.drawString("` skip   -/= volume", 3, 4);
              drawVolHud();
              cv.pushSprite(0, 0);
              Key kk;
              if (pollKey(kk)) {
                if (kk.esc || kk.enter) return false;
                handleVolKey(kk);
              }
            }
            return true;
          }

          void titleCard() {
            M5Cardputer.Display.setBrightness(255);
            cv.fillSprite(TFT_WHITE);
            cv.pushSprite(0, 0);
            M5Cardputer.Speaker.tone(110, 250);
            delay(120);
            M5Cardputer.Display.setBrightness(cfg.brightness);
            uint32_t t0 = millis();
            bool swept = false;
            while (true) {
              uint32_t e = millis() - t0;
              if (e >= 6000) break;
              float t = e / 1000.0f;
              drawScene(2, 6 + t, 0);
              float lk = (t - 0.6f) / 1.6f;
              if (lk < 0) lk = 0;
              if (lk > 1) lk = 1;
              if (lk > 0) gradText("GTA VI", W / 2, 56, 5, lk);
              cv.setTextSize(1);
              cv.setTextDatum(middle_center);
              if (t > 2.4f) {
                float a = t - 2.4f;
                if (a > 1) a = 1;
                cv.setTextColor(col(255 * a, 230 * a, 200 * a));
                cv.drawString("COMING SOON", W / 2, 86);
              }
              if (t > 3.6f) {
                float a = t - 3.6f;
                if (a > 1) a = 1;
                cv.setTextColor(col(190 * a, 150 * a, 200 * a));
                cv.drawString("(allegedly)", W / 2, 98);
              }
              bars();
              if (t > 5.2f) {
                float k = (6.0f - t) / 0.8f;
                if (k < 0) k = 0;
                M5Cardputer.Display.setBrightness((int)(cfg.brightness * k));
              }
              drawVolHud();
              cv.pushSprite(0, 0);
              if (!swept && t > 0.6f) {
                swept = true;
                for (int f = 200; f <= 900; f += 60) {
                  M5Cardputer.Speaker.tone(f, 25);
                  delay(20);
                }
              }
              Key kk;
              if (pollKey(kk)) {
                if (kk.esc || kk.enter) break;
                handleVolKey(kk);
              }
            }
            M5Cardputer.Display.setBrightness(0);
          }

          void introCinematic() {
            M5Cardputer.Display.setBrightness(0);
            if (!playScene(2, "Sun. Salt. Trouble.", 4200, 0)) { M5Cardputer.Display.setBrightness(0); return; }
            if (!playScene(1, "The night has its own rules.", 4200, 0)) { M5Cardputer.Display.setBrightness(0); return; }
            if (!playScene(0, "Dream big. Stay out of trouble.", 4200, 6)) { M5Cardputer.Display.setBrightness(0); return; }
            titleCard();
          }

          // ---------- setup wizard ----------
          void header(const char *title, int step, int total) {
            cv.fillSprite(col(20, 8, 40));
            cv.fillRect(0, 0, W, 18, col(250, 60, 150));
            cv.setTextDatum(middle_left);
            cv.setTextSize(1);
            cv.setTextColor(TFT_WHITE);
            cv.drawString(title, 6, 9);
            if (total) {
              char buf[12];
              snprintf(buf, sizeof(buf), "%d/%d", step, total);
              cv.setTextDatum(middle_right);
              cv.drawString(buf, W - 6, 9);
            }
          }

          bool textInput(const char *title, int step, int total, String &out, bool hide, const char *hint) {
            String buf = out;
            waitRelease();
            while (true) {
              header(title, step, total);
              cv.setTextDatum(top_left);
              cv.setTextSize(1);
              cv.setTextColor(TFT_WHITE);
              cv.drawString(hint, 8, 30);
              cv.drawRect(8, 55, W - 16, 22, TFT_WHITE);
              String shown = hide ? String(std::string(buf.length(), '*').c_str()) : buf;
              cv.setTextSize(2);
              cv.drawString(shown.length() > 16 ? shown.substring(shown.length() - 16) : shown, 12, 58);
              cv.setTextSize(1);
              cv.setTextColor(col(255, 150, 50));
              cv.drawString("ENTER ok   ` skip   DEL erase", 8, 118);
              cv.pushSprite(0, 0);
              Key k;
              while (!pollKey(k)) delay(10);
              if (k.enter) { out = buf; return true; }
              if (k.esc) return false;
              if (k.del && buf.length()) buf.remove(buf.length() - 1);
              else if (k.c && buf.length() < 32) buf += k.c;
            }
          }

          void sliderStep(const char *title, int step, int total, int &val, int lo, int hi, int stepSize, bool isBright) {
            waitRelease();
            while (true) {
              header(title, step, total);
              cv.drawRect(20, 60, W - 40, 16, TFT_WHITE);
              cv.fillRect(22, 62, (W - 44) * (val - lo) / (hi - lo), 12, col(255, 150, 50));
              cv.setTextDatum(top_center);
              cv.setTextSize(1);
              cv.setTextColor(TFT_WHITE);
              char b[16];
              snprintf(b, sizeof(b), "%d%%", (val - lo) * 100 / (hi - lo));
              cv.drawString(b, W / 2, 84);
              cv.drawString("< , >  /     ENTER or SPACE = ok", W / 2, 118);
              cv.pushSprite(0, 0);
              Key k;
              while (!pollKey(k)) delay(10);
              if (k.enter || k.c == ' ' || k.c == 'o') return;
              if (k.c == ',') val = max(lo, val - stepSize);
              if (k.c == '/') val = min(hi, val + stepSize);
              if (isBright) M5Cardputer.Display.setBrightness(val);
              else {
                M5Cardputer.Speaker.setVolume(val);
                M5Cardputer.Speaker.tone(800, 60);
              }
            }
          }

          void messageScreen(const char *title, const char *l1, const char *l2) {
            waitRelease();
            header(title, 0, 0);
            cv.setTextDatum(top_center);
            cv.setTextColor(TFT_WHITE);
            cv.drawString(l1, W / 2, 50);
            cv.drawString(l2, W / 2, 66);
            cv.setTextColor(col(255, 150, 50));
            cv.drawString("Press ENTER", W / 2, 112);
            cv.pushSprite(0, 0);
            Key k;
            while (true) {
              if (pollKey(k) && (k.enter || k.c == ' ')) return;
              delay(10);
            }
          }

          void connectWifi() {
            if (cfg.ssid.isEmpty()) return;
            header("Wi-Fi", 0, 0);
            cv.setTextDatum(middle_center);
            cv.setTextColor(TFT_WHITE);
            cv.drawString("Connecting...", W / 2, H / 2);
            cv.pushSprite(0, 0);
            WiFi.mode(WIFI_STA);
            WiFi.begin(cfg.ssid.c_str(), cfg.pass.c_str());
            uint32_t t0 = millis();
            while (WiFi.status() != WL_CONNECTED && millis() - t0 < 8000) delay(100);
          }

          void setupWizard() {
            const int N = 5;
            messageScreen("Welcome", "Welcome to GTA VI", "Let's set things up");
            String name = cfg.player;
            if (textInput("Player name", 1, N, name, false, "What should we call you?")) cfg.player = name;
            String ssid = cfg.ssid, pass = cfg.pass;
            if (textInput("Wi-Fi network", 2, N, ssid, false, "Network name (` to skip)")) {
              cfg.ssid = ssid;
              if (textInput("Wi-Fi password", 3, N, pass, true, "Password")) cfg.pass = pass;
            }
            sliderStep("Brightness", 4, N, cfg.brightness, 10, 255, 15, true);
            sliderStep("Volume", 5, N, cfg.volume, 0, 255, 15, false);
            saveSettings();
            applyHw();
            connectWifi();
            messageScreen("All set", "Setup complete", "Have fun in Vice City");
          }

          // ---------- home ----------
          void homeScreen(int homeVar) {
            uint32_t t0 = millis();
            M5Cardputer.Display.setBrightness(0);
            bool first = true;
            while (true) {
              float el = (millis() - t0) / 1000.0f;
              drawScene(homeVar, el + 20, 1.0f);
              uiPanel();
              cv.setTextSize(1);
              cv.setTextDatum(middle_center);
              cv.setTextColor(TFT_WHITE);
              String hello = "Hello, " + cfg.player + "   " + BUILD;
              cv.drawString(hello, W / 2, 113);
              cv.setTextColor(col(255, 200, 120));
              cv.drawString("ENTER play  ` setup  R rotate  -/= vol", W / 2, 126);
              drawVolHud();
              cv.pushSprite(0, 0);
              if (first) { fadeBrightness(0, cfg.brightness, 800); first = false; }

              Key k;
              if (pollKey(k)) {
                if (handleVolKey(k)) {
                } else if (k.enter) {
                  fadeBrightness(cfg.brightness, 0, 600);
                  prefs.begin("gta6", false);
                  int plc = prefs.getInt("plc", 0);
                  prefs.putInt("plc", plc + 1);
                  prefs.end();
                  loadingScreen(20000, 6000, plc % 3);
                  fadeBrightness(cfg.brightness, 0, 400);
                  cv.fillSprite(TFT_BLACK);
                  cv.setTextDatum(middle_center);
                  cv.setTextSize(2);
                  cv.setTextColor(col(255, 80, 80));
                  cv.drawString("ERROR", W / 2, H / 2 - 16);
                  cv.setTextSize(1);
                  cv.setTextColor(TFT_WHITE);
                  cv.drawString("Wait for the real GTA VI", W / 2, H / 2 + 6);
                  cv.drawString("Try again later", W / 2, H / 2 + 20);
                  cv.pushSprite(0, 0);
                  M5Cardputer.Speaker.tone(220, 300);
                  fadeBrightness(0, cfg.brightness, 600);
                  delay(2500);
                  fadeBrightness(cfg.brightness, 0, 600);
                  t0 = millis();
                  first = true;
                } else if (k.esc) {
                  setupWizard();
                  t0 = millis();
                  M5Cardputer.Display.setBrightness(0);
                  first = true;
                } else if (k.c == 'r' || k.c == 'R') {
                  g_rot = nextLandscape(g_rot);
                  saveRot(g_rot);
                }
              }
              delay(5);
            }
          }

          int g_homeVar = 0;

          void setup() {
            auto c = M5.config();
            M5Cardputer.begin(c, true);
            cv.createSprite(W, H);
            loadSettings();
            applyHw();

            prefs.begin("gta6", true);
            g_rot = prefs.getInt("rot", 1);
            bool rotOk = prefs.getBool("rotok", false);
            g_homeVar = prefs.getInt("plc", 0) % 3;
            prefs.end();

            M5Cardputer.Display.setRotation(g_rot);
            if (M5Cardputer.Display.width() < M5Cardputer.Display.height()) g_rot = nextLandscape(g_rot);
            if (!rotOk) {
              orientationScreen(g_rot);
              saveRot(g_rot);
            }

            rockstarSplash();
            introCinematic();
            applyHw();
            waitRelease();
            if (!setupDone()) setupWizard();
            else connectWifi();
          }

          void loop() { homeScreen(g_homeVar); }
          EOF
          grep -c introCinematic src/main.cpp
          pio run -e cardputer-adv
          B=.pio/build/cardputer-adv
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32s3 merge_bin -o GTA_VI.bin \
            --flash_mode dio --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: GTA_VI
          path: /tmp/proj/gta6-cardputer/GTA_VI.bin
