name: Build GTA_VI.bin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gta6-cardputer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio
      - run: pio run -e cardputer-adv
      - name: Merge into single flashable bin
        run: |
          B=.pio/build/cardputer-adv
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -n1)
          python -m esptool --chip esp32s3 merge_bin -o GTA_VI.bin \
            --flash_mode dio --flash_size 8MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $BOOT 0x10000 $B/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: GTA_VI
          path: gta6-cardputer/GTA_VI.bin
